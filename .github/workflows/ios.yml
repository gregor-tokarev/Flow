name: iOS

on:
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  push:
    paths: ['ios/**', '.github/workflows/ios.yml']

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test persistence and backups
        run: swift test --package-path ios/FlowCore
      - name: Build iOS app
        run: >-
          xcodebuild -project ios/Flow.xcodeproj -scheme Flow
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath ios/.build/DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Select an available iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for group in devices.values() for d in group if d["name"].startswith("iPhone")))')
          echo "FLOW_SIMULATOR_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Test UIKit flows
        run: >-
          xcodebuild -project ios/Flow.xcodeproj -scheme Flow
          -destination "platform=iOS Simulator,id=$FLOW_SIMULATOR_ID"
          -derivedDataPath ios/.build/DerivedData -resultBundlePath ios/.build/UITests.xcresult
          CODE_SIGNING_ALLOWED=NO test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: iOS-test-results
          path: ios/.build/UITests.xcresult
